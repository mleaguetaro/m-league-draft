name: Update M.LEAGUE stats and deploy

on:
  push:
    branches: [main]
  schedule:
    # 01:30 JST every day; GitHub Actions cron uses UTC.
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      refresh_stats:
        description: Fetch official Stats before deploying
        type: boolean
        default: false

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        if: github.event_name == 'schedule' || inputs.refresh_stats == true
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        if: github.event_name == 'schedule' || inputs.refresh_stats == true
        run: python -m pip install -r requirements.txt
      - name: Fetch official Stats and append points
        if: github.event_name == 'schedule' || inputs.refresh_stats == true
        run: |
          python scripts/fetch_official_stats.py
          python scripts/update_official_history.py
      - name: Commit validated data
        if: github.event_name == 'schedule' || inputs.refresh_stats == true
        run: |
          if ! git diff --quiet -- src/data/officialStats.json src/data/officialHistory.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/officialStats.json src/data/officialHistory.json
            git commit -m "Update official M.LEAGUE stats"
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
